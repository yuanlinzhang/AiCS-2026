<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AiCS 2026 Webpages</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        ul { list-style-type: square; }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Repository Webpages</h1>
    <div id="menu-container">Loading files...</div>

    <script>
        async function loadRepositoryFiles() {
            // Hardcoded to your specific repository details
            const username = 'yuanlinzhang';
            const repo = 'AiCS-2026';
            const apiUrl = `https://github.com{username}/${repo}/contents/`;
            
            try {
                const response = await fetch(apiUrl);
                const files = await response.json();
                
                // Filter down to only look for files ending in .html 
                // and skip this index.html file itself
                const htmlFiles = files.filter(file => 
                    file.name.endsWith('.html') && file.name !== 'index.html'
                );

                if (htmlFiles.length === 0) {
                    document.getElementById('menu-container').innerHTML = '<p>No other HTML files found.</p>';
                    return;
                }

                let listHtml = '<ul>';
                htmlFiles.forEach(file => {
                    // file.path matches your exact filename structure for the link
                    listHtml += `<li><a href="${file.path}">${file.name}</a></li>`;
                });
                listHtml += '</ul>';

                document.getElementById('menu-container').innerHTML = listHtml;
            } catch (error) {
                console.error('Error fetching repository files:', error);
                document.getElementById('menu-container').innerHTML = '<p>Error loading files automatically.</p>';
            }
        }

        // Run the script as soon as the page loads
        loadRepositoryFiles();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AiCS 2026 Webpages</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 30px; max-width: 800px; margin: 0 auto; color: #24292e; }
        h1 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
        ul { list-style-type: none; padding-left: 0; }
        li { padding: 8px 12px; margin-bottom: 6px; background: #f6f8fa; border-radius: 6px; border: 1px solid #e1e4e6; }
        a { color: #0366d6; text-decoration: none; font-weight: 500; font-family: monospace; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Repository Webpages</h1>
    <ul id="file-list">Loading files...</ul>

    <script>
        async function loadFilesFromGitLog() {
            const listElement = document.getElementById('file-list');
            
            try {
                // Fetches the Git commit tree metadata directly via GitHub Pages protocol
                const response = await fetch('https://github.io');
                
                if (!response.ok) {
                    // Fallback to checking the main branch feed if logs are hidden
                    const feedResponse = await fetch('https://github.com');
                    const text = await feedResponse.text();
                    parseAndDisplay(text, listElement);
                    return;
                }
                
                const logText = await response.text();
                parseAndDisplay(logText, listElement);

            } catch (e) {
                // Final bulletproof backup: Scrape the repository's frontend index page safely
                try {
                    const scrapeResponse = await fetch('https://allorigins.win' + encodeURIComponent('https://github.com'));
                    const json = await scrapeResponse.json();
                    
                    // Regex search for all HTML files present in the raw page structure
                    const matches = [...json.contents.matchAll(/href="\/yuanlinzhang\/AiCS-2026\/blob\/main\/([^"\s]+\.html)"/g)];
                    const uniqueFiles = [...new Set(matches.map(m => m[1]))].filter(f => f !== 'index.html');

                    if(uniqueFiles.length === 0) throw new Error("No files found");

                    listElement.innerHTML = uniqueFiles.map(file => 
                        `<li><a href="${file}">${file}</a></li>`
                    ).join('');
                } catch(err) {
                    listElement.innerHTML = '<li>⚠️ Automatic loading failed. Please double-check that your files are pushed to the main branch.</li>';
                }
            }
        }

        function parseAndDisplay(rawText, container) {
            // Looking for any string paths ending with .html inside the data string
            const regex = /([\w\d\-\_\.\/]+\.html)/g;
            const matches = rawText.match(regex) || [];
            
            // Filter out index.html and delete duplicate references
            const htmlFiles = [...new Set(matches)].filter(file => file !== 'index.html');

            if (htmlFiles.length === 0) {
                container.innerHTML = '<li>No HTML files discovered in this repository yet.</li>';
                return;
            }

            // Sort files alphabetically
            htmlFiles.sort();

            container.innerHTML = htmlFiles.map(file => 
                `<li><a href="${file}">${file}</a></li>`
            ).join('');
        }

        loadFilesFromGitLog();
    </script>

</body>
</html>
